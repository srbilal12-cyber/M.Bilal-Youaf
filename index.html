    // --- Subtle Audio Synthesizer ---
    class CyberAudio {
      constructor() {
        this.ctx = null;
        this.muted = true;
        this.humOsc = null;
        this.humGain = null;
        this.humActive = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.init();
        this.muted = !this.muted;
        if (this.muted && this.humActive) {
          this.stopHum();
        }
        if (!this.muted) {
          this.playConfirm();
        }
        return this.muted;
      }

      startHum() {
        this.init();
        if (this.muted || this.humOsc || !this.ctx) return false;
        try {
          const now = this.ctx.currentTime;
          this.humOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(140, now);

          this.humGain = this.ctx.createGain();
          this.humGain.gain.setValueAtTime(0.0001, now);
          this.humGain.gain.exponentialRampToValueAtTime(0.02, now + 1.2);

          this.humOsc.type = 'triangle';
          this.humOsc.frequency.setValueAtTime(55, now);

          this.humOsc.connect(filter);
          filter.connect(this.humGain);
          this.humGain.connect(this.ctx.destination);
          this.humOsc.start(now);
          this.humActive = true;
          return true;
        } catch(e) {
          return false;
        }
      }

      stopHum() {
        if (!this.humOsc || !this.ctx) return false;
        try {
          const now = this.ctx.currentTime;
          if (this.humGain) {
            this.humGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
          }
          setTimeout(() => {
            if (this.humOsc) {
              try { this.humOsc.stop(); } catch(e){}
              this.humOsc = null;
            }
          }, 600);
          this.humActive = false;
          return false;
        } catch(e) {
          this.humActive = false;
          return false;
        }
      }

      toggleHum() {
        this.init();
        if (this.humActive) {
          return this.stopHum();
        } else {
          return this.startHum();
        }
      }

      playHover() {
        if (this.muted || !this.ctx) return;
        try {

          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.03);
          gain.gain.setValueAtTime(0.025, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch(e) {}
      }

      playClick() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();

          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);

      playConfirm() {

        try {
          const now = this.ctx.currentTime;

                  </div>
                </div>

                <div className="space-y-3 pt-2 font-mono text-xs">
                  {/* Verified Gmail */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconMail />
                      <span>GMAIL:</span>
                    </span>
                    <a 
                      href={`mailto:${USER_INFO.email}`} 
                      className="dark:text-cyan-400 text-sky-600 hover:underline font-semibold"
                      onClick={() => sound.playClick()}
                    >
                      {USER_INFO.email}
                    </a>
                  </div>

                  {/* Phone */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconPhone />
                      <span>PHONE:</span>
                    </span>
                    <span className="dark:text-emerald-400 text-emerald-600 font-semibold">{USER_INFO.phone}</span>
                  </div>

                  {/* LinkedIn */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconLinkedin />
                      <span>LINKEDIN:</span>
                    </span>
                    <a 
                      href={USER_INFO.linkedin} 
                      target="_blank" 
                      rel="noreferrer" 
                      className="dark:text-cyan-400 text-sky-600 hover:underline font-semibold flex items-center gap-1"
                      onClick={() => sound.playClick()}
                    >
                      <span>Muhammad Bilal Yousaf</span>
                      <IconExternal />
                    </a>
                  </div>

                  {/* GitHub */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconGithub />
                      <span>GITHUB:</span>
                    </span>
                    <a 
                      href={USER_INFO.github} 
                      target="_blank" 
                      rel="noreferrer" 
                      className="dark:text-cyan-400 text-sky-600 hover:underline font-semibold flex items-center gap-1"
                      onClick={() => sound.playClick()}
                    >
                      <span>srbilal12-cyber</span>
                      <IconExternal />
                    </a>
                  </div>

                  {/* HemoScan Project */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconHeart />
                      <span>HEMOSCAN APP:</span>
                    </span>
                    <a 
                      href={USER_INFO.hemoscanUrl} 
                      target="_blank" 
                      rel="noreferrer" 
                      className="text-red-500 dark:text-red-400 hover:underline font-semibold flex items-center gap-1"
                      onClick={() => sound.playClick()}
                    >
                      <span>hemo-scan.replit.app</span>
                      <IconExternal />
                    </a>
                  </div>

                  {/* Printable Resume */}
                  <div className="p-3 dark:bg-slate-950/70 bg-slate-50 rounded-xl border dark:border-slate-800 border-slate-200 flex items-center justify-between">
                    <span className="dark:text-slate-400 text-slate-500 flex items-center gap-1.5">
                      <IconDownload />
                      <span>VERIFIED CV:</span>
                    </span>
                    <a 
                      href={USER_INFO.resumeUrl} 
                      target="_blank" 
                      rel="noreferrer" 
                      className="text-cyan-400 hover:underline font-semibold flex items-center gap-1"
                      onClick={() => sound.playClick()}
                    >
                      <span>Printable Resume</span>
                      <IconExternal />
                    </a>
                  </div>
                </div>
              </div>
            </div>

            {/* Right: Message Dispatch Form */}
            <div className="lg:col-span-7 dark:bg-slate-900/90 bg-white/95 border dark:border-slate-800 border-slate-200 rounded-2xl p-6 sm:p-8 shadow-md relative">
              <h3 className="font-display font-bold text-2xl dark:text-white text-slate-900 mb-2">
                Send Direct Transmission
              </h3>
              <p className="dark:text-slate-400 text-slate-600 text-sm mb-6">
                Transmit a secure message directly to Muhammad Bilal Yousaf ({USER_INFO.email}).
              </p>

              {transmitted ? (
                <div className="py-10 text-center space-y-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-6">
                  <div className="w-14 h-14 mx-auto rounded-full bg-emerald-500/20 border-2 border-emerald-500 flex items-center justify-center text-emerald-400 text-2xl shadow-[0_0_20px_rgba(16,185,129,0.3)]">
                    âœ“
                  </div>
                  <h4 className="font-display font-bold text-xl text-emerald-400">
                    Transmission Dispatched Successfully
                  </h4>
                  <p className="dark:text-slate-300 text-slate-600 text-sm max-w-md mx-auto leading-relaxed">
                    Your packet has been transmitted for <strong>{USER_INFO.email}</strong>. A response will be dispatched within 24 business hours.
                  </p>

                  <div className="pt-2 flex flex-wrap items-center justify-center gap-3">
                    <a
                      href={mailtoUrl}
                      className="px-6 py-2.5 rounded-lg bg-emerald-500 text-slate-950 font-display font-bold text-xs uppercase tracking-wider hover:bg-emerald-400 transition-all flex items-center gap-1.5 shadow-md"
                    >
                      <IconMail />
                      <span>Open in Mail Client / Gmail â†—</span>
                    </a>

                    <button
                      onClick={() => {
                        sound.playClick();
                        setTransmitted(false);
                        setFormData({ name: '', email: '', message: '' });
                      }}
                      className="px-5 py-2.5 dark:bg-slate-800 bg-slate-200 dark:text-slate-300 text-slate-700 font-display font-bold text-xs rounded-lg hover:bg-slate-300 dark:hover:bg-slate-700 transition-all"
                    >
                      SEND ANOTHER TRANSMISSION
                    </button>
                  </div>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-5">
                  <div>
                    <label className="block font-mono text-xs dark:text-cyan-400 text-sky-600 mb-1.5 uppercase font-semibold">
                      [01] Full Name / Organization
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Recruiter / Healthcare Researcher"
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      onFocus={() => sound.playHover()}
                      className="w-full dark:bg-slate-950/70 bg-slate-50 border dark:border-slate-800 border-slate-300 focus:border-cyan-400 rounded-xl px-4 py-3 text-sm dark:text-slate-100 text-slate-900 outline-none transition-all dark:placeholder-slate-600 placeholder-slate-400"
                    />
                  </div>

                  <div>
                    <label className="block font-mono text-xs dark:text-emerald-400 text-emerald-600 mb-1.5 uppercase font-semibold">
                      [02] Your Email Address
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. partner@institute.org"
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      onFocus={() => sound.playHover()}
                      className="w-full dark:bg-slate-950/70 bg-slate-50 border dark:border-slate-800 border-slate-300 focus:border-emerald-400 rounded-xl px-4 py-3 text-sm dark:text-slate-100 text-slate-900 outline-none transition-all dark:placeholder-slate-600 placeholder-slate-400"
                    />
                  </div>

                  <div>
                    <label className="block font-mono text-xs dark:text-purple-400 text-purple-600 mb-1.5 uppercase font-semibold">
                      [03] Message / Project Inquiry
                    </label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Outline collaboration opportunities, cyber engineering, or HemoScan queries..."
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      onFocus={() => sound.playHover()}
                      className="w-full dark:bg-slate-950/70 bg-slate-50 border dark:border-slate-800 border-slate-300 focus:border-purple-400 rounded-xl px-4 py-3 text-sm dark:text-slate-100 text-slate-900 outline-none transition-all dark:placeholder-slate-600 placeholder-slate-400"
                    ></textarea>
                  </div>

                  {transmitting && (
                    <div className="p-3 dark:bg-slate-950 bg-slate-100 rounded-lg border border-cyan-400 font-mono text-xs space-y-2">
                      <div className="flex justify-between text-cyan-500 font-semibold">
                        <span>
                          {transmissionStep === 1 && 'ENCRYPTING PAYLOAD & VALIDATING HEADERS...'}
                          {transmissionStep === 2 && 'HANDSHAKE VERIFIED VIA FORMSPREE PROTOCOL...'}
                          {transmissionStep === 3 && `DISPATCHING TELEMETRY TO ${USER_INFO.email}...`}
                        </span>
                        <span>{transmissionStep * 33}%</span>
                      </div>
                      <div className="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                        <div 
                          className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-300"
                          style={{ width: `${transmissionStep * 33.3}%` }}
                        ></div>
                      </div>
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={transmitting}
                    onMouseEnter={() => sound.playHover()}
                    className="cyber-button w-full py-4 bg-gradient-to-r from-cyan-500 via-sky-500 to-emerald-500 text-white dark:text-black font-display font-extrabold text-sm tracking-wider uppercase shadow-[0_0_25px_rgba(0,240,255,0.3)] hover:shadow-[0_0_35px_rgba(0,240,255,0.6)] hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                  >
                    <IconActivity />
                    <span>{transmitting ? 'TRANSMITTING PACKET...' : 'TRANSMIT ENCRYPTED MESSAGE'}</span>
                  </button>
                </form>
              )}
            </div>

          </div>
        </section>
      );
    };

    // --- Footer ---
    const Footer = () => {
      const [uptime, setUptime] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => setUptime(prev => prev + 1), 1000);
        return () => clearInterval(interval);
      }, []);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `00:${m}:${s}`;
      };

      const scrollToTop = () => {
        sound.playConfirm();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="border-t dark:border-slate-800 border-slate-200 dark:bg-[#070b14]/95 bg-white/95 pt-12 pb-16 relative">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div className="space-y-1 text-center md:text-left">
                <div className="flex items-center justify-center md:justify-start gap-2 font-mono text-xs text-emerald-500">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>SYSTEM ONLINE // ALL PROTOCOLS VERIFIED</span>
                </div>
                <p className="font-display text-sm dark:text-slate-300 text-slate-700">
                  {USER_INFO.name} Â© 2026. BS Cybersecurity Student @ CUST â€¢ Lead Architect of <a href={USER_INFO.hemoscanUrl} target="_blank" rel="noreferrer" className="text-red-500 hover:underline">HemoScan</a> â€¢ <a href={USER_INFO.github} target="_blank" rel="noreferrer" className="text-cyan-400 hover:underline">GitHub (srbilal12-cyber)</a> â€¢ <a href={USER_INFO.linkedin} target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">LinkedIn</a>.
                </p>
                <p className="font-mono text-[11px] dark:text-slate-500 text-slate-400">
                  SESSION UPTIME: <span className="dark:text-cyan-400 text-sky-600">{formatTime(uptime)}</span> â€¢ {USER_INFO.location}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <a
                  href={USER_INFO.resumeUrl}
                  target="_blank"
                  rel="noreferrer"
                  onMouseEnter={() => sound.playHover()}
                  onClick={() => sound.playConfirm()}
                  className="cyber-button px-5 py-3 dark:bg-slate-900 bg-white border dark:border-cyan-400/60 border-cyan-600/60 dark:text-cyan-300 text-sky-700 font-mono text-xs font-bold tracking-wider uppercase hover:border-cyan-400 transition-all flex items-center gap-2 shadow-sm"
                >
                  <IconDownload />
                  <span>RESUME / CV</span>
                </a>

                <button
                  onClick={scrollToTop}
                  onMouseEnter={() => sound.playHover()}
                  className="cyber-button px-6 py-3 dark:bg-slate-900 bg-white border dark:border-cyan-400 border-sky-600 dark:text-cyan-400 text-sky-700 font-mono text-xs font-bold tracking-wider uppercase dark:hover:bg-cyan-400 dark:hover:text-black hover:bg-sky-50 transition-all flex items-center gap-2 group shadow-sm"
                >
                  <span>BEAM UP</span>
                  <span className="group-hover:-translate-y-1 transition-transform">â–²</span>
                </button>
              </div>

            </div>
          </div>
        </footer>
      );
    };

    // --- Main App ---
    const App = () => {
      const [theme, setTheme] = useState('dark');
      const [soundMuted, setSoundMuted] = useState(sound.muted);
      const [humActive, setHumActive] = useState(sound.humActive);

      useEffect(() => {
        document.documentElement.className = theme === 'dark' ? 'dark scroll-smooth' : 'light scroll-smooth';
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
        sound.playConfirm();
      };

      const toggleSound = () => {
        const isMuted = sound.toggleMute();
        setSoundMuted(isMuted);
      };

      const toggleHum = () => {
        const active = sound.toggleHum();
        setHumActive(active);
      };

      return (
        <div className="relative min-h-screen">
          <Navbar 
            theme={theme} 
            toggleTheme={toggleTheme} 
            soundMuted={soundMuted} 
            toggleSound={toggleSound}
            humActive={humActive}
            toggleHum={toggleHum}
          />
          <main>
            <Hero theme={theme} />
            <AboutTerminal />
            <HemoScanShowcase />
            <TechnicalProjectsShowcase />
            <SkillsGrid />
            <ContactTransmission />
          </main>
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
